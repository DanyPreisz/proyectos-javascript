<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo de Selectores Básicos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- El ID debe ser único en el documento -->
  <header id="main-header">
    <h1>Portal de Noticias</h1>
    <p>Actualidad y tecnología al instante</p>
  </header>

  <main>
    <!-- Las clases se pueden reutilizar en múltiples elementos -->
    <article class="card">
      <h2>Noticia Destacada</h2>
      <p>Los navegadores modernos soportan nuevas funciones de diseño nativo.</p>
      <button class="btn">Leer más</button>
    </article>

    <article class="card">
      <h2>Diseño Web</h2>
      <p>Aprender la cascada y la especificidad evita errores comunes.</p>
      <button class="btn">Leer más</button>
    </article>
  </main>

</body>
</html>
