<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora de Alquiler de Autos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 340px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      text-align: center;
      color: #1e293b;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
      color: #475569;
    }

    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .result {
      margin-top: 16px;
      padding: 12px;
      background-color: #f1f5f9;
      border-radius: 4px;
      display: none;
    }

    .result p {
      margin: 6px 0;
      font-size: 0.9rem;
      color: #334155;
    }

    .highlight {
      font-weight: bold;
      color: #0f172a;
    }

    .total-row {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #cbd5e1;
      font-size: 1.05rem;
      font-weight: bold;
      color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tarifa de Devolución</h2>

    <div class="form-group">
      <label for="kmInput">Kilómetros recorridos:</label>
      <input type="number" id="kmInput" min="0" step="0.1" placeholder="Ej: 450" />
    </div>

    <button id="btnCalcular">Calcular Tarifa</button>

    <div class="result" id="panelResultado">
      <p>Base fija: <span class="highlight">$500.00</span></p>
      <p>Excedente (> 300 km): <span class="highlight" id="lblExcedente"></span> km</p>
      <p class="total-row">Total a Cobrar: $<span id="lblTotal"></span></p>
    </div>
  </div>

  <script>
    const btnCalcular = document.querySelector("#btnCalcular");
    const kmInput = document.querySelector("#kmInput");
    const panelResultado = document.querySelector("#panelResultado");
    const lblExcedente = document.querySelector("#lblExcedente");
    const lblTotal = document.querySelector("#lblTotal");

    btnCalcular.addEventListener("click", () => {
      const val = kmInput.value.trim();

      if (val === "") {
        alert("Por favor, ingrese el kilometraje recorrido.");
        return;
      }

      const km = parseFloat(val);

      if (km < 0) {
        alert("El kilometraje no puede ser un valor negativo.");
        return;
      }

      const base = 500;
      let excedente = 0;
      let total = 0;

      if (km <= 300) {
        total = base;
      } else if (km <= 1000) {
        excedente = km - 300;
        total = base + (excedente * 3);
      } else {
        excedente = km - 300;
        total = base + (excedente * 1.5);
      }

      lblExcedente.textContent = excedente.toFixed(1);
      lblTotal.textContent = total.toFixed(2);
      panelResultado.style.display = "block";
    });
  </script>

</body>
</html>
