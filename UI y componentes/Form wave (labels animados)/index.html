<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form wave · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #14110e;
        --card: #231e19;
        --ink: #f4eee6;
        --muted: #b3a89a;
        --line: #3a322a;
        --accent: #e8b86d;
        --accent-ink: #2a1f12;
        --shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        color: var(--ink);
        font-family: Outfit, system-ui, sans-serif;
        background:
          radial-gradient(circle at 14% 10%, #3a2a18 0%, transparent 34%),
          radial-gradient(circle at 90% 100%, #2a241c 0%, transparent 32%),
          var(--bg);
      }
      .page {
        width: min(400px, 100%);
        padding: 32px 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: color-mix(in srgb, var(--card) 92%, black);
        box-shadow: var(--shadow);
      }
      .eyebrow {
        margin-bottom: 8px;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(1.7rem, 4vw, 2.1rem);
      }
      .lede { margin: 8px 0 20px; color: var(--muted); line-height: 1.5; }
      .field {
        position: relative;
        margin-bottom: 28px;
        padding-top: 18px;
      }
      .field input {
        width: 100%;
        height: 44px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font: inherit;
        outline: none;
      }
      .field input:focus { border-bottom-color: var(--accent); }
      .field label {
        position: absolute;
        left: 0;
        top: 26px;
        pointer-events: none;
      }
      .field label span {
        display: inline-block;
        color: var(--muted);
        min-width: 0.3em;
        transition: transform 300ms ease, color 300ms ease;
      }
      .field input:focus + label span,
      .field input:valid + label span {
        color: var(--accent);
        transform: translateY(-22px);
      }
      .btn {
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">HTML · CSS · JS vanilla</p>
      <h1>Form wave</h1>
      <p class="lede">El label se parte en letras y sube en ola al enfocar.</p>

      <form>
        <div class="field">
          <input id="email" type="email" required autocomplete="email" />
          <label for="email">Email</label>
        </div>
        <div class="field">
          <input id="pass" type="password" required autocomplete="current-password" />
          <label for="pass">Contraseña</label>
        </div>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </main>

    <script>
      document.querySelectorAll(".field label").forEach((label) => {
        label.innerHTML = [...label.textContent]
          .map(
            (ch, i) =>
              `<span style="transition-delay:${i * 50}ms">${ch === " " ? "&nbsp;" : ch}</span>`
          )
          .join("");
      });

      document.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
      });
    </script>
  </body>
</html>
