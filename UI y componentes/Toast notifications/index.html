<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast notifications · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">HTML · CSS · JS vanilla</p>
      <h1>Toast notifications</h1>
      <p class="lede">
        Avisos que aparecen abajo a la derecha, se apilan y desaparecen solos.
      </p>

      <div class="actions">
        <button class="btn" type="button" data-toast="ok">Éxito</button>
        <button class="btn btn-info" type="button" data-toast="info">Info</button>
        <button class="btn btn-danger" type="button" data-toast="error">Error</button>
      </div>
    </main>

    <div class="toaster" id="toaster" aria-live="polite" aria-relevant="additions"></div>

    <script src="app.js"></script>
  </body>
</html>
