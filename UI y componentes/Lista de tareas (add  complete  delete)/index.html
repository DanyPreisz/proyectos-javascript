<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tareas · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="eyebrow">HTML · CSS · JS vanilla</p>
        <h1>Lista de tareas</h1>
        <p class="lede">Agregá, completá y eliminá. Queda guardada en este navegador.</p>
      </header>

      <form id="form" class="form" autocomplete="off">
        <label class="sr-only" for="input">Nueva tarea</label>
        <input
          id="input"
          type="text"
          maxlength="140"
          placeholder="¿Qué tenés que hacer?"
          required
        />
        <button type="submit">Agregar</button>
      </form>

      <div class="meta">
        <p id="counter" class="counter">0 pendientes</p>
        <div class="filters" role="group" aria-label="Filtros">
          <button type="button" class="filter is-on" data-filter="all">Todas</button>
          <button type="button" class="filter" data-filter="active">Pendientes</button>
          <button type="button" class="filter" data-filter="done">Hechas</button>
        </div>
      </div>

      <ul id="list" class="list" aria-live="polite"></ul>

      <p id="empty" class="empty">
        Todavía no hay tareas.<br />
        <span>Escribí arriba y presioná Enter.</span>
      </p>

      <footer class="footer">
        <button type="button" id="clear-done" class="ghost" hidden>
          Borrar completadas
        </button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
