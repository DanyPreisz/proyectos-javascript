<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button ripple · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">HTML · CSS · JS vanilla</p>
      <h1>Button ripple</h1>
      <p class="lede">Clic en cualquier botón. La onda sale desde el punto exacto.</p>

      <div class="row">
        <button class="btn" type="button">Primario</button>
        <button class="btn btn-ghost" type="button">Secundario</button>
        <button class="btn btn-danger" type="button">Peligro</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
