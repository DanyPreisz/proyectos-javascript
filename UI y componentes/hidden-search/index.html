<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hidden search · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">HTML · CSS · JS vanilla</p>
      <h1>Hidden search</h1>
      <p class="lede">
        El buscador está cerrado. Tocá la lupa, escribí y se filtra la lista.
        Escape lo vuelve a plegar.
      </p>

      <form class="search" id="search" role="search">
        <input
          id="input"
          type="search"
          placeholder="Buscar componente..."
          autocomplete="off"
          aria-label="Buscar"
        />
        <button class="icon" type="button" id="toggle" aria-label="Abrir búsqueda" aria-expanded="false">
          ⌕
        </button>
      </form>

      <ul class="results" id="results"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
