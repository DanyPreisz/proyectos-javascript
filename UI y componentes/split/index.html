<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split landing · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="split" id="split">
      <section class="side left" data-side="left">
        <div class="copy">
          <p class="eyebrow">Vanilla JS</p>
          <h1>Frontend</h1>
          <p>HTML, CSS y componentes de interfaz.</p>
          <a class="btn" href="#">Ver proyectos</a>
        </div>
      </section>
      <section class="side right" data-side="right">
        <div class="copy">
          <p class="eyebrow">Vanilla JS</p>
          <h1>Juegos</h1>
          <p>Canvas, teclado y un poco de lógica.</p>
          <a class="btn btn-alt" href="#">Jugar</a>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
